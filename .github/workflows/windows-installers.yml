name: Windows installers

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  installer:
    name: Windows ${{ matrix.arch }} MSI
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    env:
      TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Build release executable
        shell: pwsh
        run: |
          # build.rs writes the installer icon to its OUT_DIR, whose layout is internal to Cargo.
          $messages = cargo build --locked --release --bin switchboard --target $env:TARGET --message-format=json-render-diagnostics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $icon = $messages | ForEach-Object { $_ | ConvertFrom-Json } |
            Where-Object reason -eq 'build-script-executed' |
            ForEach-Object { Join-Path $_.out_dir 'switchboard.ico' } |
            Where-Object { Test-Path -LiteralPath $_ } | Select-Object -Last 1
          if (-not $icon) { throw 'The build script did not produce switchboard.ico.' }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "SWITCHBOARD_ICON=$icon"
      - name: Restore WiX
        run: dotnet tool restore
      - name: Build per-user installer
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # MSI versions must be numeric, so a tag like v1.2.3 becomes 1.2.3.
          $version = $env:RELEASE_TAG -replace '^[vV]', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release tag '$env:RELEASE_TAG' must look like v1.2.3 to version the installer."
          }
          dotnet wix build installer\Switchboard.wxs -arch $env:ARCH `
            -d "Version=$version" -d "Executable=target\$env:TARGET\release\switchboard.exe" `
            -d "Icon=$env:SWITCHBOARD_ICON" `
            -o "target\installer\Switchboard-$env:ARCH.msi"
      - name: Smoke-test install and uninstall
        shell: pwsh
        run: |
          $msi = (Resolve-Path "target\installer\Switchboard-$env:ARCH.msi").Path
          $exe = Join-Path $env:LOCALAPPDATA 'Switchboard\switchboard.exe'
          $link = Join-Path ([Environment]::GetFolderPath('Programs')) 'Switchboard.lnk'
          $result = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart" -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Install failed: $($result.ExitCode)" }
          $expected = (Get-FileHash "target\$env:TARGET\release\switchboard.exe").Hash
          if ((Get-FileHash $exe).Hash -ne $expected) { throw 'Installed executable differs from the release build.' }
          if (-not (Test-Path -LiteralPath $link)) { throw 'Start menu shortcut is missing.' }
          $result = Start-Process msiexec.exe -ArgumentList "/x `"$msi`" /qn /norestart" -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Uninstall failed: $($result.ExitCode)" }
          if ((Test-Path $exe) -or (Test-Path $link)) { throw 'Uninstall left the executable or shortcut behind.' }
      - uses: actions/upload-artifact@v7
        with:
          path: target/installer/Switchboard-${{ matrix.arch }}.msi
          archive: false
          if-no-files-found: error

  publish:
    name: Attach both installers to the release
    needs: installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: Switchboard-*.msi
          merge-multiple: true
          path: installers
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload --clobber -- "$RELEASE_TAG" installers/Switchboard-x64.msi installers/Switchboard-arm64.msi
