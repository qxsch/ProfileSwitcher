[package]
name = "switchboard"
version = "0.1.0"
edition = "2024"
publish = false
description = "A Windows workspace for isolated Microsoft Edge profiles"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
resvg = { version = "0.49", default-features = false }
rfd = { version = "0.17", default-features = false }
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
slint = { version = "1.16", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2", "accessibility"] }
windows = { version = "0.62", features = [
    "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem",
    "Win32_System_Com", "Win32_System_JobObjects", "Win32_System_RestartManager", "Win32_System_Threading", "Win32_System_SystemServices",
    "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.16"

[profile.dev]
debug = 0

[profile.release]
strip = "symbols"
